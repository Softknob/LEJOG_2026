<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Insert your title tag and write an apporpriate title -->
    <title>LEJOG 2026</title>

    <!-- Leaflet css -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet JS (Must come after css) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-providers@1.13.0/leaflet-providers.js"></script>

    <style>
        /* set your map container height to height 100% and width 100%
    
   

        /* css written for you */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #0b356f;
            color: white;
            padding: 1rem;
            text-align: center;

        }

        .leaflet-control-layers {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
            padding: 6px 10px;
        }

        .leaflet-control-layers-toggle {
            background-color: white;
        }

        .leaflet-control-layers-expanded {
            padding: 6px 10px 6px 6px;
            font-size: 14px;
            background-color: white;
        }

        /* Styles for info panel */
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .info h4 {
            margin: 0 0 5px;
            color: #777;
        }

        #map {
            height: 780px;
            width: 1000px;
            margin-left: auto;
            margin-right: auto;

        }

        h1 {

            text-align: center;
        }

        /* 1. Set a wider desktop footprint for tables and restrict vertical height */
        .desktop-popup .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 5px;
        }

        .desktop-popup .leaflet-popup-content {
            width: 450px !important;
            /* Wider canvas ideal for structured data columns */
            max-height: 600px;
            /* Strict cap to prevent extending past screen edge */
            overflow-y: auto;
            /* Forces vertical scrollbar when contents overflow */
            overflow-x: hidden;
            /* Prevents messy horizontal scrollbars */
            padding-right: 15px;
            /* Buffer space so content doesn't tuck behind the scrollbar */
        }

        /* 2. Ensure internal tables display correctly inside the popup */
        .desktop-popup table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .desktop-popup th,
        .desktop-popup td {
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
        }

        /* 3. Prevent images from breaking out before or after loading */
        .desktop-popup img {
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        /* Container arrangement layout */
        .star-rating-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            /* Clean spacing between star elements */
        }

        /* Base structural sizing for star nodes */
        .star-icon {
            width: 16px;
            height: 16px;
        }

        /* Colour definitions */
        .star-icon.full {
            fill: #ffc107;
            /* Bright gold fill */
        }

        .star-icon.empty {
            fill: #e0e0e0;
            /* Clean light grey placeholder fill */
        }
    </style>
</head>

<body>

    <!-- <h1>Write an appropriate heading for your map</h1> -->
    <h1>LEJOG 2026 Story Map</h1>
    <!-- insert your map container -->
    <div id="map"></div>
    <script>

        function formatDateLocale(timestamp) {
            const date = new Date(Number(timestamp));
            // 'en-GB' format defaults natively to Day/Month/Year
            return date.toLocaleDateString('en-GB');
        }

        function getHalfStarRating(score) {
            const num = parseFloat(score) || 0;
            // Clamp score strictly between 0 and 5
            const finalScore = Math.max(0, Math.min(5, num));
            let starContainer = '<div class="star-rating-wrapper">';

            for (let i = 1; i <= 5; i++) {
                if (finalScore >= i) {
                    // 1. Full Star SVG
                    starContainer += `
        <svg class="star-icon full" viewBox="0 0 24 24">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>`;
                } else if (finalScore >= i - 0.5) {
                    // 2. True Half Star SVG using an internal linear gradient
                    starContainer += `
        <svg class="star-icon half" viewBox="0 0 24 24">
          <defs>
            <linearGradient id="halfGrad">
              <stop offset="50%" stop-color="#ffc107" />
              <stop offset="50%" stop-color="#e0e0e0" />
            </linearGradient>
          </defs>
          <path fill="url(#halfGrad)" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>`;
                } else {
                    // 3. Empty Star SVG
                    starContainer += `
        <svg class="star-icon empty" viewBox="0 0 24 24">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>`;
                }
            }

            starContainer += '</div>';
            return starContainer;
        }


        // // construct your Map
        const map = L.map('map').setView([55, -2], 6);
        // add your open street map base layer
        // L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        //     maxZoom: 19,
        //     attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        // }).addTo(map);

        // L.tileLayer.provider('OpenTopoMap').addTo(map);

        L.tileLayer.provider('Esri.NatGeoWorldMap').addTo(map);

        var roomIcon = L.icon({
            iconUrl: "images/noun-hotel-2673741.svg",
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            popupAnchor: [0, 0]

        });

        // Load GeoJSON
        fetch('data/Stays.geojson')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                var geojsonLayer = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.marker(latlng, { icon: roomIcon });
                    },
                    onEachFeature: function (feature, layer) {
                        let popupContent = "";

                        if (feature.properties && feature.properties.Name) {
                            popupContent = `
                <strong>${feature.properties.Name}</strong><br>
                <img src="images/${feature.properties.img}" alt="image"
                style="width:100%; max-width:1000px; height:auto; margin-top:8px; border-radius:4px">
                  <table>
                    <thead>
                        <tr>
                        <th></th>
                        <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Date</td><td>${formatDateLocale(feature.properties.Arrival_date)}</td></tr>
                        <tr><td>Cost</td><td>&pound${feature.properties.cost}</td></tr>
                        <tr><td>Score</td><td>${getHalfStarRating(feature.properties.score__5)}</td></tr>
                        <tr><td>Room</td><td>${feature.properties.room}</td></tr>
                        <tr><td>Food</td><td>${feature.properties.food}</td></tr>
                        <tr><td>Bike Storage</td><td>${feature.properties.bike_storage}</td></tr>
                        <tr><td>comments</td><td>${feature.properties.notes}</td></tr>
                    </tbody>
                    </table>

                `;
                        }
                        else {
                            popupContent = `<strong>Unnamed Stay</strong>`;

                        }
                        layer.bindPopup(popupContent, {
                            className: 'desktop-popup',   // Ties layout parameters to your CSS styles
                            maxHeight: 600,               // Caps the vertical frame boundary limits
                            autoPan: true,                // Keeps markers viewable on screen
                            autoPanPadding: L.point(10, 50), // Allocates a 50px buffer zone at the browser top edge
                            keepInView: true              // Keeps popup locked within active bounds
                        });
                    }
                }).addTo(map);

                // Zoom to layer
                map.fitBounds(geojsonLayer.getBounds());
            })
            .catch(error => {
                console.error('Error loading GeoJSON:', error);
            });


        fetch('data/days.geojson')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                var geojsonLayer = L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        // Check if your GeoJSON properties exist before using them
                        if (feature.properties && feature.properties.name) {
                            // Bind the popup to this specific line item
                            layer.bindPopup(`<b>Name:</b> ${feature.properties.name}`);
                        } else {
                            layer.bindPopup("This line has no name property.");
                        }
                    }
                }).addTo(map);

                // Zoom to layer
                map.fitBounds(geojsonLayer.getBounds());
            })
            .catch(error => {
                console.error('Error loading GeoJSON:', error);
            });
    </script>
</body>
